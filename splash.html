<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAUGHTER — Загрузка</title>
    <link rel="stylesheet" href="css/splash.css">
</head>
<body>
    <div class="splash-container">
        <!-- Фоновые частицы -->
        <div class="particles" id="particles"></div>
        
        <!-- Затемнение -->
        <div class="overlay"></div>
        
        <!-- Контент заставки -->
        <div class="splash-content">
            <!-- Логотип -->
            <div class="splash-logo">
                <span class="splash-letter">S</span>
                <span class="splash-letter">L</span>
                <span class="splash-letter">A</span>
                <span class="splash-letter">U</span>
                <span class="splash-letter">G</span>
                <span class="splash-letter">H</span>
                <span class="splash-letter">T</span>
                <span class="splash-letter">E</span>
                <span class="splash-letter">R</span>
            </div>
            
            <!-- Линия разделителя -->
            <div class="splash-divider">
                <span class="line-left"></span>
                <span class="diamond"></span>
                <span class="line-right"></span>
            </div>
            
            <!-- Подзаголовок -->
            <div class="splash-subtitle">PREMIUM SOFTWARE</div>
            
            <!-- Описание -->
            <div class="splash-description">
                <span>Загрузка системы</span>
            </div>
            
            <!-- Прогресс-бар -->
            <div class="splash-progress-container">
                <div class="splash-progress-bar" id="progressBar">
                    <div class="splash-progress-fill" id="progressFill"></div>
                </div>
                <div class="splash-progress-info">
                    <span class="splash-percentage" id="percentage">0%</span>
                    <span class="splash-status" id="statusText">Инициализация...</span>
                </div>
            </div>
            
            <!-- Версия -->
            <div class="splash-version">v4.2.1</div>
        </div>
        
        <!-- Нижняя информация -->
        <div class="splash-footer">
            <span>&copy; 2024 SLAUGHTER</span>
            <span class="separator">|</span>
            <span>Все права защищены</span>
        </div>
    </div>

    <script src="js/splash.js"></script>
</body>
</html>
